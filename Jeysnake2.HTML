<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>JeySnake</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #121a2b;
    --panel-border: rgba(255,255,255,0.08);
    --muted: #8b93a7;
    --green: #22c55e;
    --green-light: #4ade80;
    --green-glow: rgba(34, 197, 94, 0.55);
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ===== Dekorasi latar ===== */
  .decorSquare {
    position: absolute;
    border-radius: 16px;
    background: rgba(76, 175, 80, 0.06);
    pointer-events: none;
    z-index: 1;
  }
  .decorDot {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 4px;
    background: var(--green);
    opacity: 0.55;
    pointer-events: none;
    z-index: 1;
  }
  .floatParticle {
    position: fixed;
    bottom: -30px;
    font-size: 16px;
    opacity: 0;
    animation: floatUp linear infinite;
    pointer-events: none;
    z-index: 2;
    filter: drop-shadow(0 0 5px var(--green-glow));
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-100vh) rotate(25deg); opacity: 0; }
  }

  /* ===== Panel pojok (Score / High Score) ===== */
  .cornerPanel {
    position: fixed;
    top: 28px;
    left: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 20;
  }
  .cornerPanel .icon { color: var(--green); flex-shrink: 0; }
  .cornerPanel .labelBlock { display: flex; flex-direction: column; line-height: 1.15; }
  .cornerPanel .label { font-size: 13px; color: var(--muted); }
  .cornerPanel .value { font-size: 22px; font-weight: 700; }
  .cornerPanel .value.scorePop {
    animation: scorePop 0.35s ease;
  }
  @keyframes scorePop {
    0% { transform: scale(1); color: #fff; }
    40% { transform: scale(1.5); color: #ffd54f; }
    100% { transform: scale(1); color: #fff; }
  }

  .iconButtonsTopRight {
    position: fixed;
    top: 24px;
    right: 32px;
    display: flex;
    gap: 10px;
    z-index: 20;
  }
  .iconBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .iconBtn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }

  .bestScorePanel {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 16px 22px;
    min-width: 150px;
    animation: fadeSlideUp 0.4s ease;
    position: absolute;
    top: 50%;
    left: calc(50% + 260px);
    transform: translateY(-50%);
  }
  .bestScorePanel .label { display:flex; align-items:center; gap:8px; color: var(--muted); font-size: 13px; }
  .bestScorePanel .value { font-size: 24px; font-weight: 700; margin-top: 4px; }

  /* ===== Layout game ===== */
  .stageRow {
    height: 100vh;
    position: relative;
  }

  #gameWrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  @media (max-width: 760px) {
    .bestScorePanel {
      position: static;
      transform: none;
      margin: 16px auto 0;
    }
  }
  #gameWrapper.startPop { animation: arenaStartPop 0.5s ease; }
  @keyframes arenaStartPop {
    0% { transform: scale(0.85); opacity: 0.3; filter: brightness(1.8); }
    60% { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1); opacity: 1; filter: brightness(1); }
  }
  canvas {
    background: #0a0f1a;
    border: 2px solid rgba(34, 197, 94, 0.45);
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(34, 197, 94, 0.08), inset 0 0 60px rgba(0,0,0,0.4);
    display: block;
  }

  /* ===== Kotak tutorial kontrol ===== */
  #controlsHint {
    position: fixed;
    left: 32px;
    bottom: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 14px 18px;
    z-index: 15;
    animation: fadeSlideUp 0.4s ease 0.1s both;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 30px);
    grid-template-rows: repeat(2, 30px);
    gap: 4px;
  }
  .dpad .key {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border);
    display: flex; align-items: center; justify-content: center;
    color: #cfd6e4;
  }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  #controlsHint .hintText { font-size: 13px; color: var(--muted); line-height: 1.4; }

  /* ===== Layar penuh (menu utama dan game over) ===== */
  .fullScreenView {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 30;
    padding: 20px;
    animation: viewFadeIn 0.3s ease;
  }
  @keyframes viewFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .hidden { display: none !important; }

  .logoWrap { margin-bottom: 8px; animation: logoIn 0.6s ease, logoBob 2.4s ease-in-out 0.6s infinite; }
  .logoWrap svg { filter: drop-shadow(0 0 18px var(--green-glow)); }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.7) translateY(-20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes logoBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(-3deg); }
  }

  .bigTitle {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: 0.28em;
    margin: 6px 0 10px;
    padding-left: 0.28em; /* kompensasi letter-spacing biar center pas */
    animation: fadeSlideUp 0.6s ease 0.15s both;
  }
  .bigSubtitle {
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 0.02em;
    margin-bottom: 40px;
    animation: fadeSlideUp 0.6s ease 0.3s both;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bigSubtitle .dot { margin: 0 10px; opacity: 0.6; }

  .menuButtons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 360px;
  }
  .menuButtons .pillBtn {
    animation: fadeSlideUp 0.5s ease both;
  }
  .menuButtons .pillBtn:nth-child(1) { animation-delay: 0.45s; }
  .menuButtons .pillBtn:nth-child(2) { animation-delay: 0.6s; }
  .menuButtons .pillBtn:nth-child(3) { animation-delay: 0.75s; }

  .menuCard {
    position: relative;
    z-index: 10;
    background: rgba(18, 26, 43, 0.55);
    border: 1px solid var(--panel-border);
    border-radius: 28px;
    padding: 48px 46px 40px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 60px rgba(34, 197, 94, 0.08), inset 0 0 40px rgba(255,255,255,0.02);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeSlideUp 0.5s ease;
  }
  .menuDivider {
    width: 60px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    margin: 4px 0 22px;
    opacity: 0.7;
  }
  .pillBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.05);
    color: #fff;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.15s ease;
  }
  .pillBtn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.09); }
  .pillBtn:active { transform: translateY(0); }
  .pillBtn.primary {
    background: linear-gradient(135deg, var(--green-light), var(--green));
    border: none;
    color: #06210f;
    box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
  }
  .pillBtn.primary:hover { box-shadow: 0 10px 28px rgba(34, 197, 94, 0.5); }
  .pillBtn.danger { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); color: #fca5a5; }

  /* ===== Overlay di gameplay (countdown & pause) ===== */
  .arenaOverlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(5, 8, 15, 0.6);
    border-radius: 16px;
    z-index: 10;
    pointer-events: none;
  }
  .arenaOverlay.interactive { pointer-events: auto; }
  #countdownText {
    font-size: 64px;
    font-weight: 800;
    color: var(--green-light);
    text-shadow: 0 0 24px var(--green-glow);
  }
  .popAnim { animation: countPop 0.6s ease; }
  @keyframes countPop {
    0% { transform: scale(0.3); opacity: 0; }
    40% { transform: scale(1.15); opacity: 1; }
    70% { transform: scale(0.95); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ===== Modal (settings & leaderboard) ===== */
  .modalBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(4,6,12,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modalCard {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 30px 32px;
    width: 90%;
    max-width: 340px;
    text-align: center;
  }
  .modalCard h3 { margin: 0 0 18px; font-size: 20px; letter-spacing: 0.05em; }
  .diffRow { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .diffBtn {
    padding: 9px 18px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.05);
    color: #ddd;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .diffBtn.active[data-diff="easy"] { background: var(--green); border-color: var(--green); color: #06210f; }
  .diffBtn.active[data-diff="normal"] { background: #ffb300; border-color: #ffb300; color: #1e1e2f; }
  .diffBtn.active[data-diff="hard"] { background: var(--danger); border-color: var(--danger); color: #fff; }
  .leaderboardValue {
    font-size: 40px;
    font-weight: 800;
    color: #ffd54f;
    margin: 10px 0 22px;
  }
</style>
</head>
<body>

<!-- Dekorasi latar -->
<div class="decorSquare" style="top:19%; left:4%; width:70px; height:70px;"></div>
<div class="decorSquare" style="top:25%; left:8%; width:90px; height:90px; background: rgba(76,175,80,0.09);"></div>
<div class="decorDot" style="top:37%; left:6%;"></div>
<div class="decorDot" style="top:83%; left:13%;"></div>
<div class="decorSquare" style="top:58%; right:8%; width:70px; height:70px;"></div>
<div class="decorDot" style="top:72%; right:11%;"></div>

<!-- Panel pojok kiri atas -->
<div class="cornerPanel">
  <svg class="icon" width="26" height="22" viewBox="0 0 26 22" fill="none"><path d="M2 8L7 12L13 3L19 12L24 8L22 19H4L2 8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  <div class="labelBlock">
    <span class="label" id="cornerLabel">High Score</span>
    <span class="value" id="cornerValue">0</span>
  </div>
</div>

<!-- Ikon pojok kanan atas -->
<div class="iconButtonsTopRight">
  <button class="iconBtn" id="soundBtn" title="Suara">
    <svg id="soundIconOn" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16 8a5 5 0 010 8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
    <svg id="soundIconOff" width="18" height="18" viewBox="0 0 24 24" fill="none" class="hidden"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button class="iconBtn hidden" id="pauseBtn" title="Jeda">
    <svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    <svg id="resumeIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 4l14 8-14 8V4z"/></svg>
  </button>
  <button class="iconBtn" id="gearBtn" title="Pengaturan">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
  </button>
</div>

<!-- Panggung game -->
<div class="stageRow">
  <div id="gameWrapper">
    <canvas id="gameCanvas" width="440" height="440"></canvas>

    <!-- Overlay hitung mundur -->
    <div id="countdownOverlay" class="arenaOverlay" style="display:none;">
      <div id="countdownText">3</div>
    </div>

    <!-- Overlay jeda -->
    <div id="pauseOverlay" class="arenaOverlay interactive hidden">
      <h2 style="margin-bottom:20px; letter-spacing:0.15em;">DIJEDA</h2>
      <div class="menuButtons" style="max-width:220px;">
        <button class="pillBtn primary" onclick="resumeGame()">▶ Lanjutkan</button>
        <button class="pillBtn danger" onclick="showMainMenu()">Menu Utama</button>
      </div>
    </div>
  </div>

  <div class="bestScorePanel hidden" id="bestScorePanel">
    <span class="label">
      <svg width="16" height="14" viewBox="0 0 26 22" fill="none"><path d="M2 8L7 12L13 3L19 12L24 8L22 19H4L2 8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Best Score
    </span>
    <span class="value" id="bestScoreValue">0</span>
  </div>
</div>

<!-- Kotak panduan kontrol -->
<div id="controlsHint" class="hidden">
  <div class="dpad">
    <div class="key up">↑</div>
    <div class="key left">←</div>
    <div class="key down">↓</div>
    <div class="key right">→</div>
  </div>
  <div class="hintText">Gunakan tombol panah<br>untuk mengendalikan ular</div>
</div>

<!-- Menu Utama -->
<div id="mainMenu" class="fullScreenView">
  <span class="floatParticle" style="left:6%; animation-duration:9s; animation-delay:0s;">🍏</span>
  <span class="floatParticle" style="left:14%; animation-duration:11s; animation-delay:2s;">✨</span>
  <span class="floatParticle" style="left:88%; animation-duration:10s; animation-delay:1s;">🍏</span>
  <span class="floatParticle" style="left:92%; animation-duration:12s; animation-delay:3.5s;">✨</span>
  <span class="floatParticle" style="left:8%; animation-duration:9.5s; animation-delay:5s;">🍏</span>

  <div class="menuCard">
    <div class="logoWrap">
      <svg width="130" height="110" viewBox="0 0 130 110" fill="none">
        <path d="M20 60c15 0 15-35 35-35s15 35 35 35 15-30 30-15" stroke="url(#g)" stroke-width="14" stroke-linecap="round" fill="none"/>
        <circle cx="118" cy="47" r="4" fill="#06210f"/>
        <path d="M124 45c4-2 8-1 10 1" stroke="var(--green-light)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="130" y2="0">
            <stop offset="0%" stop-color="#4ade80"/>
            <stop offset="100%" stop-color="#16a34a"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h1 class="bigTitle">JeySnake</h1>
    <div class="menuDivider"></div>
    <div class="bigSubtitle">Eat <span class="dot">•</span> Grow <span class="dot">•</span> Get the High Score</div>
    <div class="menuButtons">
      <button class="pillBtn primary" onclick="startGame()">▶ &nbsp;Play</button>
      <button class="pillBtn" onclick="openLeaderboard()">📊 &nbsp;Leaderboard</button>
      <button class="pillBtn" onclick="openSettings()">⚙️ &nbsp;Settings</button>
    </div>
  </div>
</div>

<!-- Layar Game Over -->
<div id="gameOverScreen" class="fullScreenView hidden">
  <h1 class="bigTitle" style="font-size:42px; color:#ff6b6b;">GAME OVER</h1>
  <p style="color:var(--muted); margin-bottom:4px;">Skor Kamu</p>
  <div class="leaderboardValue" id="finalScore">0</div>
  <p id="newRecordText" class="hidden" style="color:#ffd54f; font-weight:bold; margin-bottom:18px;">🎉 Rekor Baru!</p>
  <div class="menuButtons">
    <button class="pillBtn primary" onclick="startGame()">🔄 &nbsp;Main Lagi</button>
    <button class="pillBtn" onclick="showMainMenu()">☰ &nbsp;Menu Utama</button>
  </div>
</div>

<!-- Modal Settings -->
<div id="settingsModal" class="modalBackdrop hidden">
  <div class="modalCard">
    <h3>PENGATURAN</h3>
    <p style="color:var(--muted); font-size:13px; margin-top:-10px; margin-bottom:14px;">Tingkat Kesulitan</p>
    <div class="diffRow">
      <button class="diffBtn" data-diff="easy" onclick="setDifficulty('easy')">Easy</button>
      <button class="diffBtn" data-diff="normal" onclick="setDifficulty('normal')">Normal</button>
      <button class="diffBtn" data-diff="hard" onclick="setDifficulty('hard')">Hard</button>
    </div>
    <button class="pillBtn" onclick="closeSettings()">Tutup</button>
  </div>
</div>

<!-- Modal Leaderboard -->
<div id="leaderboardModal" class="modalBackdrop hidden">
  <div class="modalCard">
    <h3>🏆 SKOR TERTINGGI</h3>
    <div class="leaderboardValue" id="leaderboardValue">0</div>
    <button class="pillBtn" onclick="closeLeaderboard()">Tutup</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const box = 22;

const mainMenu = document.getElementById("mainMenu");
const gameOverScreen = document.getElementById("gameOverScreen");
const countdownOverlay = document.getElementById("countdownOverlay");
const countdownText = document.getElementById("countdownText");
const pauseOverlay = document.getElementById("pauseOverlay");
const bestScorePanel = document.getElementById("bestScorePanel");
const bestScoreValue = document.getElementById("bestScoreValue");
const controlsHint = document.getElementById("controlsHint");
const cornerLabel = document.getElementById("cornerLabel");
const cornerValue = document.getElementById("cornerValue");
const finalScoreEl = document.getElementById("finalScore");
const newRecordText = document.getElementById("newRecordText");
const pauseBtn = document.getElementById("pauseBtn");
const soundBtn = document.getElementById("soundBtn");
const gearBtn = document.getElementById("gearBtn");
const settingsModal = document.getElementById("settingsModal");
const leaderboardModal = document.getElementById("leaderboardModal");
const leaderboardValueEl = document.getElementById("leaderboardValue");
const pauseIcon = document.getElementById("pauseIcon");
const resumeIcon = document.getElementById("resumeIcon");
const soundIconOn = document.getElementById("soundIconOn");
const soundIconOff = document.getElementById("soundIconOff");

let snake, prevSnake, direction, food, score;
let particles = [];
let lastFrameTime = performance.now();
let moveTimer = null;
let renderLoopId = null;
let lastTickTime = 0;
let isPlaying = false;
let isPaused = false;
let menuOpen = true;
let countdownGen = 0;
let countdownTimeoutId = null;
let difficulty = "normal";
let muted = false;
const speedMap = { easy: 220, normal: 160, hard: 100 };
let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;

updateScoreDisplays();
setDifficulty(difficulty);

// ===== Suara sederhana (WebAudio) =====
let audioCtx = null;
function beep(freq, duration, type = "sine") {
  if (muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

soundBtn.addEventListener("click", () => {
  muted = !muted;
  soundIconOn.classList.toggle("hidden", muted);
  soundIconOff.classList.toggle("hidden", !muted);
});

// ===== Setting & Leaderboard modal =====
function openSettings() {
  settingsModal.classList.remove("hidden");
  if (isPlaying) pauseGame();
}
function closeSettings() { settingsModal.classList.add("hidden"); }
gearBtn.addEventListener("click", openSettings);

function openLeaderboard() {
  leaderboardValueEl.innerText = highScore;
  leaderboardModal.classList.remove("hidden");
}
function closeLeaderboard() { leaderboardModal.classList.add("hidden"); }

function setDifficulty(level) {
  difficulty = level;
  document.querySelectorAll(".diffBtn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.diff === level);
  });
}

function updateScoreDisplays() {
  if (menuOpen) {
    cornerLabel.innerText = "High Score";
    cornerValue.innerText = highScore;
  } else {
    cornerLabel.innerText = "Score";
    cornerValue.innerText = score || 0;
  }
  bestScoreValue.innerText = highScore;
}

function hideFullScreens() {
  mainMenu.classList.add("hidden");
  gameOverScreen.classList.add("hidden");
  countdownOverlay.style.display = "none";
  pauseOverlay.classList.add("hidden");
}

function showMainMenu() {
  isPlaying = false;
  isPaused = false;
  menuOpen = true;
  countdownGen++;
  clearTimeout(countdownTimeoutId);
  clearInterval(moveTimer);
  hideFullScreens();
  settingsModal.classList.add("hidden");
  leaderboardModal.classList.add("hidden");
  mainMenu.classList.remove("hidden");
  bestScorePanel.classList.add("hidden");
  controlsHint.classList.add("hidden");
  pauseBtn.classList.add("hidden");
  soundBtn.classList.remove("hidden");
  updateScoreDisplays();
}

function startGame() {
  settingsModal.classList.add("hidden");
  hideFullScreens();
  menuOpen = false;
  bestScorePanel.classList.remove("hidden");
  controlsHint.classList.remove("hidden");
  pauseBtn.classList.remove("hidden");
  soundBtn.classList.add("hidden");
  pauseIcon.classList.remove("hidden");
  resumeIcon.classList.add("hidden");

  const gameWrapperEl = document.getElementById("gameWrapper");
  gameWrapperEl.classList.remove("startPop");
  void gameWrapperEl.offsetWidth;
  gameWrapperEl.classList.add("startPop");

  snake = [{ x: 9 * box, y: 9 * box }];
  prevSnake = [{ x: 9 * box, y: 9 * box }];
  direction = null;
  score = 0;
  particles = [];
  updateScoreDisplays();
  spawnFood();

  clearInterval(moveTimer);
  isPlaying = false;
  isPaused = false;

  runCountdown(() => {
    lastTickTime = performance.now();
    moveTimer = setInterval(tick, speedMap[difficulty]);
    isPlaying = true;
  });

  if (!renderLoopId) renderLoopId = requestAnimationFrame(renderLoop);
}

function pauseGame() {
  if (!isPlaying || isPaused) return;
  isPaused = true;
  clearInterval(moveTimer);
  pauseOverlay.classList.remove("hidden");
  pauseIcon.classList.add("hidden");
  resumeIcon.classList.remove("hidden");
}

function resumeGame() {
  if (!isPaused) return;
  isPaused = false;
  pauseOverlay.classList.add("hidden");
  lastTickTime = performance.now();
  moveTimer = setInterval(tick, speedMap[difficulty]);
  pauseIcon.classList.remove("hidden");
  resumeIcon.classList.add("hidden");
}

pauseBtn.addEventListener("click", () => {
  if (isPaused) resumeGame(); else pauseGame();
});

function runCountdown(callback) {
  const steps = ["3", "2", "1", "MULAI!"];
  clearTimeout(countdownTimeoutId);
  const gen = ++countdownGen;
  let idx = 0;

  countdownOverlay.style.display = "flex";

  function showNext() {
    if (gen !== countdownGen) return;
    if (idx >= steps.length) {
      countdownOverlay.style.display = "none";
      callback();
      return;
    }
    countdownText.textContent = steps[idx];
    countdownText.classList.remove("popAnim");
    void countdownText.offsetWidth;
    countdownText.classList.add("popAnim");
    idx++;
    countdownTimeoutId = setTimeout(showNext, 600);
  }
  showNext();
}

function spawnFood() {
  let newFood, isOnSnake;
  do {
    newFood = {
      x: Math.floor(Math.random() * (canvas.width / box)) * box,
      y: Math.floor(Math.random() * (canvas.height / box)) * box
    };
    isOnSnake = snake.some(seg => seg.x === newFood.x && seg.y === newFood.y);
  } while (isOnSnake);
  food = newFood;
}

document.addEventListener("keydown", changeDirection);

function changeDirection(event) {
  const key = event.key;
  if (key === "Escape") {
    if (!menuOpen) showMainMenu();
    return;
  }
  if (key === " " && isPlaying) {
    if (isPaused) resumeGame(); else pauseGame();
    return;
  }
  if (isPaused) return;
  if ((key === "ArrowLeft" || key === "a") && direction !== "RIGHT") direction = "LEFT";
  else if ((key === "ArrowUp" || key === "w") && direction !== "DOWN") direction = "UP";
  else if ((key === "ArrowRight" || key === "d") && direction !== "LEFT") direction = "RIGHT";
  else if ((key === "ArrowDown" || key === "s") && direction !== "UP") direction = "DOWN";
}

function tick() {
  if (!direction) {
    lastTickTime = performance.now();
    return;
  }

  prevSnake = snake.map(seg => ({ x: seg.x, y: seg.y }));

  let headX = snake[0].x;
  let headY = snake[0].y;

  if (direction === "LEFT") headX -= box;
  if (direction === "UP") headY -= box;
  if (direction === "RIGHT") headX += box;
  if (direction === "DOWN") headY += box;

  const ateFood = headX === food.x && headY === food.y;

  if (ateFood) {
    score++;
    updateScoreDisplays();
    cornerValue.classList.remove("scorePop");
    void cornerValue.offsetWidth;
    cornerValue.classList.add("scorePop");
    spawnParticles(food.x + box / 2, food.y + box / 2);
    beep(660, 0.12, "square");
    spawnFood();
    prevSnake.push({ ...prevSnake[prevSnake.length - 1] });
  }

  const newHead = { x: headX, y: headY };
  const hitWall = headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height;
  const hitSelf = snake.some(seg => seg.x === headX && seg.y === headY);

  if (hitWall || hitSelf) {
    endGame();
    return;
  }

  snake.unshift(newHead);
  if (!ateFood) snake.pop();

  lastTickTime = performance.now();
}

function drawGrid() {
  ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += box) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += box) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawFood(x, y, t) {
  const pulse = 1 + Math.sin(t / 260) * 0.08;
  const size = (box - 6) * pulse;
  const offset = (box - size) / 2;

  ctx.save();
  ctx.shadowColor = "#4ade80";
  ctx.shadowBlur = 16;
  ctx.fillStyle = "#4ade80";
  roundedRect(x + offset, y + offset, size, size, 6);
  ctx.fill();
  ctx.restore();
}

function spawnParticles(x, y) {
  const colors = ["#4ade80", "#22c55e", "#ffffff", "#a7f3d0"];
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
    const speed = 1 + Math.random() * 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 2 + Math.random() * 2
    });
  }
}

function updateAndDrawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 0.06;
    p.y += p.vy * dt * 0.06;
    p.vy += 0.01 * dt * 0.06;
    p.life -= dt * 0.0022;

    if (p.life <= 0) { particles.splice(i, 1); continue; }

    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawSnake(t) {
  const interp = [];
  for (let i = 0; i < snake.length; i++) {
    const cur = snake[i];
    const prev = prevSnake[i] || cur;
    interp.push({
      x: prev.x + (cur.x - prev.x) * t,
      y: prev.y + (cur.y - prev.y) * t
    });
  }

  const now = performance.now();

  ctx.save();
  ctx.shadowColor = "#22c55e";
  ctx.shadowBlur = 10;

  for (let i = interp.length - 1; i >= 0; i--) {
    const seg = interp[i];
    const isHead = i === 0;
    const pad = isHead ? 0 : 1;

    const wave = Math.sin(now / 180 - i * 0.9) * (isHead ? 0 : 1.2);
    const wx = seg.x + (direction === "UP" || direction === "DOWN" ? wave : 0);
    const wy = seg.y + (direction === "LEFT" || direction === "RIGHT" ? wave : 0);

    ctx.fillStyle = isHead ? "#4ade80" : "#22c55e";
    roundedRect(wx + pad, wy + pad, box - pad * 2, box - pad * 2, isHead ? 7 : 6);
    ctx.fill();
  }
  ctx.restore();

  if (interp.length > 0) {
    const head = interp[0];
    const cx = head.x + box / 2;
    const cy = head.y + box / 2;
    let eyeOffset = { x: 5, y: -5 };
    if (direction === "LEFT") eyeOffset = { x: -5, y: 0 };
    else if (direction === "RIGHT") eyeOffset = { x: 5, y: 0 };
    else if (direction === "UP") eyeOffset = { x: 0, y: -5 };
    else if (direction === "DOWN") eyeOffset = { x: 0, y: 5 };

    ctx.fillStyle = "#06210f";
    ctx.beginPath();
    ctx.arc(cx + eyeOffset.x * 0.6, cy + eyeOffset.y * 0.6, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderLoop(now) {
  if (menuOpen) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (countdownOverlay.style.display !== "none") countdownOverlay.style.display = "none";
    renderLoopId = requestAnimationFrame(renderLoop);
    return;
  }

  ctx.fillStyle = "#0a0f1a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrid();

  if (food) drawFood(food.x, food.y, now);
  if (snake) {
    const t = (isPlaying && !isPaused) ? Math.min(1, (now - lastTickTime) / speedMap[difficulty]) : 1;
    drawSnake(t);
  }

  const dt = now - lastFrameTime;
  lastFrameTime = now;
  if (particles.length) updateAndDrawParticles(dt);

  renderLoopId = requestAnimationFrame(renderLoop);
}
renderLoopId = requestAnimationFrame(renderLoop);

function endGame() {
  isPlaying = false;
  isPaused = false;
  clearInterval(moveTimer);
  beep(160, 0.35, "sawtooth");

  let isNewRecord = false;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("snakeHighScore", highScore);
    isNewRecord = true;
  }

  finalScoreEl.innerText = score;
  newRecordText.classList.toggle("hidden", !isNewRecord);

  hideFullScreens();
  bestScorePanel.classList.add("hidden");
  controlsHint.classList.add("hidden");
  pauseBtn.classList.add("hidden");
  soundBtn.classList.remove("hidden");
  menuOpen = true; // supaya arena kosong lagi di belakang layar game over
  updateScoreDisplays();
  gameOverScreen.classList.remove("hidden");
}
</script>
